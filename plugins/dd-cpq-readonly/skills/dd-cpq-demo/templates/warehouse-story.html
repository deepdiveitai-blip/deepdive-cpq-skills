<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ask the Warehouse — DD CPQ</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #131a2b;
    --panel-2: #1a2338;
    --border: #2a3550;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --dim: #64748b;
    --accent: #a78bfa;
    --accent-2: #22d3ee;
    --highlight: #fbbf24;
    --highlight-bg: rgba(251, 191, 36, 0.15);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif;
    line-height: 1.6;
  }
  .hero {
    padding: 60px 40px 40px;
    background: radial-gradient(ellipse at top, #1e293b 0%, #0a0e1a 60%);
    border-bottom: 1px solid var(--border);
  }
  .hero .kicker {
    color: var(--accent);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .hero h1 {
    font-size: 32px;
    line-height: 1.25;
    margin: 0 auto;
    max-width: 900px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 40px;
    max-width: 1400px;
    margin: 0 auto;
    padding: 48px 40px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .answer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px;
  }
  .answer h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 20px;
    font-weight: 600;
  }
  .answer-body {
    font-size: 16px;
    color: #e2e8f0;
  }
  .answer-body p { margin: 0 0 16px; }
  .answer-body strong { color: white; font-weight: 600; }
  .answer-body em { color: var(--muted); font-style: normal; }
  .answer-body code {
    background: var(--panel-2);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 14px;
    color: var(--accent-2);
  }
  .citation-marker {
    display: inline-block;
    background: var(--accent);
    color: #0a0e1a;
    padding: 1px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    margin: 0 2px;
    text-decoration: none;
    transition: all 0.15s;
  }
  .citation-marker:hover { background: white; transform: scale(1.1); }
  .citation-marker.uncited {
    background: var(--dim);
    color: var(--muted);
  }

  .sources {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .sources h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin: 0 0 8px;
    font-weight: 600;
  }
  .cite {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    transition: all 0.2s;
    position: relative;
  }
  .cite.highlighted {
    border-color: var(--highlight);
    background: linear-gradient(180deg, var(--highlight-bg), var(--panel));
    transform: translateX(-4px);
    box-shadow: -4px 0 0 var(--highlight);
  }
  .cite-header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .cite-ordinal {
    background: var(--accent);
    color: #0a0e1a;
    width: 24px; height: 24px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 13px;
    flex-shrink: 0;
  }
  .cite.uncited .cite-ordinal { background: var(--dim); color: var(--muted); }
  .cite-source-type {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .cite-score {
    margin-left: auto;
    font-size: 11px;
    color: var(--dim);
    font-family: 'SF Mono', Consolas, monospace;
  }
  .cite-title {
    font-size: 15px;
    font-weight: 600;
    color: white;
    margin-bottom: 6px;
    line-height: 1.35;
  }
  .cite-excerpt {
    font-size: 13px;
    color: var(--muted);
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    line-height: 1.5;
  }
  .cite-link {
    display: inline-block;
    margin-top: 10px;
    color: var(--accent-2);
    font-size: 12px;
    text-decoration: none;
    font-weight: 500;
  }
  .cite-link:hover { text-decoration: underline; }

  .empty {
    padding: 40px;
    text-align: center;
    color: var(--muted);
    background: var(--panel);
    border-radius: 12px;
    border: 1px dashed var(--border);
  }

  footer {
    padding: 24px 40px;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
    border-top: 1px solid var(--border);
    margin-top: 40px;
  }
</style>
</head>
<body>

<div class="hero">
  <div style="max-width: 900px; margin: 0 auto;">
    <div class="kicker">Ask the Warehouse · Fin.ai-style RAG</div>
    <h1 id="query-text">QUERY_TEXT_PLACEHOLDER</h1>
  </div>
</div>

<main>
  <div class="answer">
    <h2>Answer</h2>
    <div class="answer-body" id="answer-body"></div>
  </div>

  <div class="sources">
    <h2>Sources (<span id="cite-count">0</span>)</h2>
    <div id="cite-list"></div>
  </div>
</main>

<footer>
  Generated by <code style="color: var(--accent);">dd_cpq_ask_warehouse</code> ·
  Retrieval: pgvector hybrid search ·
  Synthesis: Claude with <code style="color: var(--accent);">[N]</code> citation grounding
</footer>

<script>
// Injected by the demo skill from dd_cpq_ask_warehouse output.
const ANSWER_MARKDOWN = "ANSWER_MARKDOWN_PLACEHOLDER";
const CITATIONS = CITATIONS_JSON_PLACEHOLDER;
const CITED_ORDINALS = CITED_ORDINALS_JSON_PLACEHOLDER;

function sourceTypeIcon(t) {
  const map = {
    'JIRA': '🎫',
    'ADO': '🎫',
    'Confluence': '📄',
    'Notion': '📓',
    'GoogleDoc': '📄',
    'GoogleSlides': '🎯',
    'GoogleSheets': '📊',
    'SharePoint': '📄',
    'OneDrive': '📁',
    'SlackMessage': '💬',
    'TeamsMessage': '💬',
    'EmailOutlook': '✉️',
    'EmailGmail': '✉️',
    'Chatter': '💬',
    'GitCommit': '💻',
    'CodeComment': '💻',
    'README': '📖',
    'BRD': '📋',
    'DesignDoc': '📐',
    'TestPlan': '🧪',
    'TestCase': '🧪',
    'Runbook': '📔',
    'MeetingRecording': '🎥',
    'TrainingVideo': '🎬',
    'DemoRecording': '🎬',
    'OtterTranscript': '🎙️',
    'ArchitectureDiagram': '🗺️',
    'UIScreenshot': '🖼️',
    'Whiteboard': '🎨'
  };
  return map[t] || '📎';
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderAnswer() {
  // Convert `[N]` markers into clickable spans; preserve markdown-esque line breaks.
  const raw = ANSWER_MARKDOWN || '(empty)';
  // Very light markdown: paragraphs on blank lines, bold **x**, code `x`
  const paragraphs = raw.split(/\n\n+/).map(p => {
    let html = escapeHtml(p);
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
    html = html.replace(/\[(\d+)\]/g, (m, n) => {
      const isCited = CITED_ORDINALS.includes(parseInt(n, 10));
      return `<a class="citation-marker${isCited ? '' : ' uncited'}" data-ordinal="${n}" href="#cite-${n}" title="Jump to citation ${n}">${n}</a>`;
    });
    html = html.replace(/\n/g, '<br>');
    return `<p>${html}</p>`;
  }).join('');
  document.getElementById('answer-body').innerHTML = paragraphs;

  // Wire hover/click on citation markers → highlight the citation card
  document.querySelectorAll('.citation-marker').forEach(a => {
    const ord = a.dataset.ordinal;
    a.addEventListener('mouseenter', () => setHighlight(ord, true));
    a.addEventListener('mouseleave', () => setHighlight(ord, false));
  });
}

function renderCitations() {
  const list = document.getElementById('cite-list');
  document.getElementById('cite-count').textContent = CITATIONS.length;
  if (CITATIONS.length === 0) {
    list.innerHTML = '<div class="empty">No sources returned — warehouse retrieval was empty. This usually means the customerSlug doesn\'t match ingested data, or the topic hasn\'t been ingested yet.</div>';
    return;
  }
  list.innerHTML = '';
  CITATIONS.forEach(c => {
    const el = document.createElement('div');
    const isCited = CITED_ORDINALS.includes(c.ordinal);
    el.className = 'cite' + (isCited ? '' : ' uncited');
    el.id = 'cite-' + c.ordinal;
    const icon = sourceTypeIcon(c.sourceType);
    el.innerHTML = `
      <div class="cite-header">
        <div class="cite-ordinal">${c.ordinal}</div>
        <div class="cite-source-type">${icon} ${escapeHtml(c.sourceType)}${c.sourceId ? ' · ' + escapeHtml(c.sourceId) : ''}</div>
        <div class="cite-score">score ${(c.score || 0).toFixed(2)}</div>
      </div>
      ${c.title ? `<div class="cite-title">${escapeHtml(c.title)}</div>` : ''}
      <div class="cite-excerpt">${escapeHtml(c.excerpt || '')}</div>
      ${c.sourceUrl ? `<a class="cite-link" href="${escapeHtml(c.sourceUrl)}" target="_blank" rel="noopener">Open source ↗</a>` : ''}
    `;
    list.appendChild(el);
  });
}

function setHighlight(ordinal, on) {
  const el = document.getElementById('cite-' + ordinal);
  if (!el) return;
  el.classList.toggle('highlighted', on);
  if (on) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// initial render
document.getElementById('query-text').textContent = document.getElementById('query-text').textContent;
renderAnswer();
renderCitations();
</script>

</body>
</html>
